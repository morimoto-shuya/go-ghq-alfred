name: test
on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: make test
      - name: build
        run: make dist
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghq-alfred.alfredworkflow
          path: ./ghq-alfred.alfredworkflow
