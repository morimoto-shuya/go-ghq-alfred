name: test
on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup mise
        uses: jdx/mise-action@v2
      - name: test
        run: mise run test
      - name: build
        run: mise run dist
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghq-alfred.alfredworkflow
          path: ./ghq-alfred.alfredworkflow
